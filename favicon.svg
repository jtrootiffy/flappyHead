<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="JTL">
  <title>JTL</title>

  <!-- App-tinted rounded tile, so the white letters stay legible on any
       browser chrome (light or dark). -->
  <defs>
    <linearGradient id="jtl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a4d" />
      <stop offset="1" stop-color="#0b1620" />
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="7" fill="url(#jtl-bg)" />

  <!-- "J T L" in the same 5x7 pixel style as the in-canvas score font. -->
  <g fill="#ffffff" shape-rendering="crispEdges" transform="translate(3 13) scale(2)">
    <!-- J -->
    <rect x="2" y="0" width="3" height="1" />
    <rect x="3" y="1" width="1" height="5" />
    <rect x="0" y="5" width="1" height="1" />
    <rect x="1" y="6" width="2" height="1" />

    <!-- T -->
    <rect x="6" y="0" width="5" height="1" />
    <rect x="8" y="1" width="1" height="6" />

    <!-- L -->
    <rect x="12" y="0" width="1" height="6" />
    <rect x="12" y="6" width="5" height="1" />
  </g>
</svg>
